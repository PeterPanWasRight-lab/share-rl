<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MP-Net 状态机配置编辑器</title>
  <link rel="stylesheet" href="/static/style.css" />
  <!-- Cytoscape.js CDN -->
  <script src="https://unpkg.com/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
  <!-- Dagre layout for hierarchical graphs -->
  <script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
  <script src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
</head>
<body>

<!-- ===== 顶部标题栏 ===== -->
<header id="header">
  <h1>🤖 MP-Net 状态机配置编辑器</h1>
  <div id="header-actions">
    <button id="btn-save" title="保存当前配置">💾 保存</button>
    <button id="btn-validate" title="验证配置合法性">✅ 验证</button>
    <button id="btn-relayout" title="重新布局图">🔄 重排</button>
  </div>
</header>

<div id="main">

  <!-- ===== 左侧面板：配置列表 + 全局设置 ===== -->
  <aside id="left-panel">
    <section id="config-list-section">
      <h2>配置列表</h2>
      <div id="config-list"></div>
      <div id="config-actions">
        <input type="text" id="new-config-name" placeholder="新配置名称..." />
        <button id="btn-new-config">+ 新建</button>
      </div>
    </section>

    <section id="global-settings">
      <h2>全局设置</h2>
      <label>
        起始原语 (start)
        <select id="sel-start-primitive"></select>
      </label>
      <label>
        复位原语 (reset)
        <select id="sel-reset-primitive"></select>
      </label>
      <label>
        帧率 (fps)
        <input type="number" id="inp-fps" min="1" max="1000" value="10" />
      </label>
    </section>

    <section id="add-section">
      <h2>添加元素</h2>
      <button id="btn-add-primitive" class="btn-full">+ 添加原语节点</button>
      <button id="btn-add-transition" class="btn-full">+ 添加转移边</button>
    </section>
  </aside>

  <!-- ===== 中央画布：Cytoscape 图 ===== -->
  <main id="cy-container">
    <div id="cy"></div>
    <div id="graph-legend">
      <span class="legend-item"><span class="legend-dot scripted"></span> 脚本化原语</span>
      <span class="legend-item"><span class="legend-dot rl"></span> RL 原语</span>
      <span class="legend-item"><span class="legend-dot start"></span> 起始节点</span>
      <span class="legend-item"><span class="legend-dot terminal"></span> 终止节点</span>
    </div>
  </main>

  <!-- ===== 右侧面板：属性编辑器 ===== -->
  <aside id="right-panel">
    <div id="detail-placeholder">
      <p>👈 点击图中的节点或边查看属性</p>
    </div>
    <div id="detail-content" style="display:none;"></div>
  </aside>

</div>

<!-- ===== 模态框：添加原语 ===== -->
<div id="modal-overlay" class="modal-overlay" style="display:none;">
  <div class="modal" id="modal-add-primitive" style="display:none;">
    <h3>添加原语节点</h3>
    <label>名称 <input type="text" id="modal-prim-name" placeholder="例: approach_A" /></label>
    <label>类型 <select id="modal-prim-type"></select></label>
    <label>从哪个节点连接过来（必选，保证新节点可达）
      <select id="modal-prim-connect-from"></select>
    </label>
    <label>连接到哪个节点（非终止节点必选）
      <select id="modal-prim-connect-to">
        <option value="">（不创建出边）</option>
      </select>
    </label>
    <label>说明 <input type="text" id="modal-prim-notes" placeholder="（可选）原语用途说明" /></label>
    <label><input type="checkbox" id="modal-prim-terminal" /> 终止节点 (is_terminal)</label>
    <div class="modal-target-section">
      <h4>目标位姿 [x, y, z, rx, ry, rz]</h4>
      <div class="target-inputs">
        <input type="number" step="0.001" id="modal-t0" placeholder="x" value="0" />
        <input type="number" step="0.001" id="modal-t1" placeholder="y" value="0" />
        <input type="number" step="0.001" id="modal-t2" placeholder="z" value="0" />
        <input type="number" step="0.001" id="modal-t3" placeholder="rx" value="0" />
        <input type="number" step="0.001" id="modal-t4" placeholder="ry" value="0" />
        <input type="number" step="0.001" id="modal-t5" placeholder="rz" value="0" />
      </div>
    </div>
    <div class="modal-actions">
      <button id="modal-prim-ok">确定</button>
      <button id="modal-prim-cancel" class="btn-secondary">取消</button>
    </div>
  </div>

  <div class="modal" id="modal-add-transition" style="display:none;">
    <h3>添加转移边</h3>
    <label>起始原语 (source) <select id="modal-trans-source"></select></label>
    <label>目标原语 (target) <select id="modal-trans-target"></select></label>
    <label>转移类型
      <select id="modal-trans-type"></select>
    </label>
    <p id="modal-trans-help" class="form-help"></p>
    <div id="modal-trans-params" class="transition-parameter-fields"></div>
    <div class="modal-actions">
      <button id="modal-trans-ok">确定</button>
      <button id="modal-trans-cancel" class="btn-secondary">取消</button>
    </div>
  </div>
</div>

<!-- ===== Toast 通知 ===== -->
<div id="toast" class="toast"></div>

<script src="/static/app.js"></script>
</body>
</html>
