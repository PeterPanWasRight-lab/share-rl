[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project.urls]
homepage = "https://github.com/jstranghoener/share-rl"
source = "https://github.com/jstranghoener/share-rl"
issues = "https://github.com/jstranghoener/share-rl/issues"

[project]
name = "share-rl"
version = "0.0.4"
description = "share: LeRobot extension for structured manipulation, teleoperation, and workspace tooling"
dynamic = ["readme"]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Spes Robotics", email = "contact@spes.ai" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["lerobot", "share", "robotics", "teleoperation", "offline rl"]
dependencies = [
    "lerobot>=0.5.0,<0.6.0",
    "modern_robotics>=1.1.1,<2.0.0",
    "scipy>=1.11.0,<2.0.0",
    "matplotlib>=3.8.0,<4.0.0",
    "atomics>=1.0.0",
    "pyrealsense2>=2.56.5",
    "grpcio>=1.80.0",
    "pyserial>=3.5,<4.0"
]

[project.optional-dependencies]
ur = [
    "ur-rtde==1.6.2",
]
spacemouse = [
    "easyhid==0.0.10",
]
aloha = [
    "dynamixel-sdk>=3.7.31,<3.9.0",
]
mujoco = [
    "mujoco>=3.2.0,<4.0.0",
    "transformers==5.3.0",
]

pose-estimation = [
    "pose-estimation @ git+ssh://git@github.com/ubi-coro/pose-estimation.git",
]
test = [
    "pytest>=8.1.0,<9.0.0",
    "pytest-timeout>=2.4.0,<3.0.0",
    "pytest-cov>=5.0.0,<8.0.0",
]
all = [
    "share-rl[mujoco]",
    "share-rl[ur]",
    "share-rl[spacemouse]",
    "share-rl[aloha]",
    "share-rl[test]",
    "share-rl[pose-estimation]"
]

[project.scripts]
share-record = "share.scripts.record:main"
share-actor = "share.scripts.actor_server:main"
share-learner = "share.scripts.learner_server:main"
share-mujoco-demo = "share.scripts.mujoco_demo:main"
share-design-constraints = "share.scripts.design_constraints:design_constraints"
share-train = "share.scripts.train:main"
share-eval = "share.scripts.eval_on_dataset:main"
share-workspace = "share.scripts.robot_workspace:main"
share-visualize = "share.scripts.visualize:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["share*"]

[tool.setuptools.package-data]
"share.robots.mujoco" = [
    "assets/*.xml",
    "assets/*.md",
    "assets/act/*.xml",
    "assets/act/*.md",
    "assets/act/LICENSE",
    "assets/menagerie/universal_robots_ur5e/*.xml",
    "assets/menagerie/universal_robots_ur5e/*.md",
    "assets/menagerie/universal_robots_ur5e/*.png",
    "assets/menagerie/universal_robots_ur5e/LICENSE",
    "assets/menagerie/universal_robots_ur5e/assets/*.obj",
    "assets/menagerie/robotiq_2f85/*.xml",
    "assets/menagerie/robotiq_2f85/*.md",
    "assets/menagerie/robotiq_2f85/*.png",
    "assets/menagerie/robotiq_2f85/LICENSE",
    "assets/menagerie/robotiq_2f85/assets/*.stl",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
